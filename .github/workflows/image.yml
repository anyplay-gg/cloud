name: image

# Builds the cloud and relay images on every merge to main and pushes them to ghcr.io, so that a
# deploy pulls an image instead of compiling the workspace on the server:
#
#   ghcr.io/anyplaynet/cloud:<commit>   ghcr.io/anyplaynet/cloud:main
#   ghcr.io/anyplaynet/relay:<commit>   ghcr.io/anyplaynet/relay:main
#
# Each image carries an attestation of its digest (actions/attest-build-provenance), so a deploy can
# check with `gh attestation verify` that this workflow built it. `deploy/update.sh --image` does so
# (docs/deploy.md). On pull requests that touch the Dockerfile or this file, the same build runs
# without pushing, so the workflow is tried before it reaches main.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - deploy/Dockerfile
      - deploy/Dockerfile.dockerignore
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io/anyplaynet

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # pushes the images
      id-token: write # the OIDC token the attestation is signed with
      attestations: write # stores the attestation
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: cloud
      - id: network-pin
        name: Read the pinned network revision
        shell: bash
        run: |
          ref=$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/cloud/network.ref")
          [[ $ref =~ ^[0-9a-f]{40}$ ]] || { echo "network.ref must hold one full commit SHA" >&2; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: anyplaynet/network
          ref: ${{ steps.network-pin.outputs.ref }}
          path: network
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One BuildKit cache per image (scope), kept in the Actions cache. The cloud build exports all
      # its layers, the dependency layer from cargo-chef included. The relay shares that build stage,
      # so it reads the cloud's cache and only stores its own last layers.
      - id: cloud
        name: Build the cloud image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: cloud/deploy/Dockerfile
          target: cloud
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/cloud:${{ github.sha }}
            ${{ env.REGISTRY }}/cloud:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=anyplay-cloud
          sbom: ${{ env.PUSH == 'true' }}
          provenance: ${{ env.PUSH == 'true' && 'mode=max' || 'false' }}
          cache-from: type=gha,scope=cloud
          cache-to: type=gha,scope=cloud,mode=max,ignore-error=true
      - id: relay
        name: Build the relay image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: cloud/deploy/Dockerfile
          target: relay
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.REGISTRY }}/relay:${{ github.sha }}
            ${{ env.REGISTRY }}/relay:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=anyplay-relay
          sbom: ${{ env.PUSH == 'true' }}
          provenance: ${{ env.PUSH == 'true' && 'mode=max' || 'false' }}
          cache-from: |
            type=gha,scope=relay
            type=gha,scope=cloud
          cache-to: type=gha,scope=relay,mode=min,ignore-error=true

      - if: env.PUSH == 'true'
        name: Attest the cloud image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/cloud
          subject-digest: ${{ steps.cloud.outputs.digest }}
          push-to-registry: true
      - if: env.PUSH == 'true'
        name: Attest the relay image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/relay
          subject-digest: ${{ steps.relay.outputs.digest }}
          push-to-registry: true

      - if: env.PUSH == 'true'
        name: What to deploy
        env:
          CLOUD_DIGEST: ${{ steps.cloud.outputs.digest }}
          RELAY_DIGEST: ${{ steps.relay.outputs.digest }}
        run: |
          {
            echo "## Images for ${GITHUB_SHA}"
            echo
            echo "- cloud: \`${REGISTRY}/cloud@${CLOUD_DIGEST}\`"
            echo "- relay: \`${REGISTRY}/relay@${RELAY_DIGEST}\`"
            echo
            echo "Deploy on the server:"
            echo '```'
            echo "cloud/deploy/update.sh --cloud ${GITHUB_SHA} --image ${CLOUD_DIGEST} --relay-image ${RELAY_DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

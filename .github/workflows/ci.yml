name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Trivy for the image report, checked against its published SHA-256 before it runs
  # (trivy_<version>_checksums.txt of the release).
  TRIVY_VERSION: 0.75.0
  TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f

# The cloud depends on the network's API crate by relative path (`../network/crates/api`), so
# every job checks out both repositories side by side.

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: cloud
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: anyplay-gg/network
          path: network
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: cloud
      - name: Format
        # Not `--all`: that would also check the network checkout's crates.
        run: |
          cargo fmt -p anyplay-ticket -p anyplay-cloud -p anyplay-relay -p anyplay-e2e -p anyplay-load -- --check
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # The web portal (web/): a static React app the cloud will serve. Tokens, types, lint, tests and
  # the production build, with the lockfile frozen. No Rust, so it does not need the network checkout.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: cloud
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: cloud/web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: cloud/web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Colour tokens are up to date
        run: node scripts/gen-tokens.mjs --check
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Route tree is committed
        run: git diff --exit-code -- src/routeTree.gen.ts

  # The same tests with the store in PostgreSQL instead of a SQLite file
  # (docs/adr/0003-postgres-for-a-cluster.md), and tests/cluster.rs with two nodes that share
  # the database and tell each other about changes over NATS (docs/adr/0004).
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgres:18-alpine, pinned by digest.
        image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      nats:
        # nats:2.15-alpine, pinned by digest.
        image: nats:2.15-alpine@sha256:7ae34c25dfd6fe2e01c6483eabef20d796690fdcac6c4d94ca780a6cf9877fde
        ports:
          - 4222:4222
    defaults:
      run:
        working-directory: cloud
    env:
      ANYPLAY_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres
      ANYPLAY_TEST_NATS_URL: nats://127.0.0.1:4222
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: cloud
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: anyplay-gg/network
          path: network
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: cloud
      - name: Test on PostgreSQL, and as a cluster of two nodes
        run: cargo test -p anyplay-cloud

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: cloud
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: anyplay-gg/network
          path: network
      - name: Build the cloud image
        run: docker build -f cloud/deploy/Dockerfile --target cloud -t anyplay-cloud .
      - name: Build the relay image
        run: docker build -f cloud/deploy/Dockerfile --target relay -t anyplay-relay .
      - name: Build the Caddy image
        run: docker build -f cloud/deploy/Dockerfile --target caddy -t anyplay-caddy .
      - name: Check the compose file
        env:
          CLOUD_DOMAIN: cloud.example.com
          RELAY_DOMAIN: relay.example.com
          ACME_EMAIL: operator@example.com
        run: docker compose -f cloud/deploy/compose.yaml config --quiet
      # The images start and answer: the cloud on its health check and /v1/info, then the relay
      # with the key the cloud wrote, in plain HTTP (development mode), on its health route.
      - name: Start the images
        run: |
          docker volume create smoke-data
          docker run -d --name smoke-cloud -p 8080:8080 -v smoke-data:/data \
            -e ANYPLAY_CLOUD_PUBLIC_URL=http://127.0.0.1:8080 \
            -e ANYPLAY_CLOUD_PORTAL_DIR=/usr/share/anyplay/portal anyplay-cloud
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f "{{.State.Health.Status}}" smoke-cloud)" = healthy ] && break
            sleep 2
          done
          docker inspect -f "{{.State.Health.Status}}" smoke-cloud | grep -qx healthy
          curl -fsS http://127.0.0.1:8080/v1/info
          echo
          # the portal: the landing at /, the app shell under it, the API beside it
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/ | grep -q '/assets/'
          curl -fsS http://127.0.0.1:8080/sign-in | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8080/web/api/v1/session | grep -q '"flow"'
          docker run -d --name smoke-relay -p 3340:3340 -v smoke-data:/cloud:ro             -e ANYPLAY_RELAY_CLOUD_PUBLIC_KEY_FILE=/cloud/signing.pub             -e ANYPLAY_RELAY_TLS=none -e ANYPLAY_RELAY_HTTP_BIND=0.0.0.0:3340 anyplay-relay
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3340/healthz && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3340/healthz
      - name: Logs of the images
        if: always()
        run: |
          docker logs smoke-cloud || true
          docker logs smoke-relay || true

      # Nothing pushes these images, so there is no registry to attach an SBOM or a provenance
      # attestation to; the first workflow that pushes one adds both (docs/supply-chain.md). What
      # CI can do today is look at what it built: a CycloneDX SBOM of each image (kept as an
      # artifact) and a Trivy report of fixable HIGH and CRITICAL findings in the job summary.
      #
      # Report only, on purpose: a new CVE in a Debian package would turn every unrelated pull
      # request red, and nobody has seen the baseline yet. To make it block, set TRIVY_EXIT_CODE
      # to "1" below, drop `continue-on-error`, and accept known findings in a `.trivyignore`
      # with a reason for each.
      - name: Install Trivy
        run: |
          curl -fsSL -o trivy.tar.gz \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          sudo install trivy /usr/local/bin/trivy
      - name: SBOM and vulnerability report of the images
        continue-on-error: true
        env:
          TRIVY_EXIT_CODE: "0"
        run: |
          mkdir -p image-reports
          status=0
          {
            echo "## Image scan (report only)"
            echo
            echo "HIGH and CRITICAL findings that have a fix. Not blocking yet: docs/supply-chain.md."
          } >> "$GITHUB_STEP_SUMMARY"
          for image in anyplay-cloud anyplay-relay anyplay-caddy; do
            trivy image --quiet --format cyclonedx --output "image-reports/$image.cdx.json" "$image"
            trivy image --quiet --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code "$TRIVY_EXIT_CODE" --format table --output "image-reports/$image.txt" "$image" || status=$?
            {
              echo
              echo "### $image"
              echo '```'
              cat "image-reports/$image.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-reports
          path: image-reports/*
          if-no-files-found: ignore

  # Links, title IDs in code, licences and advisories: the rules every AnyPlay repository shares.
  rules:
    uses: anyplay-gg/.github/.github/workflows/rules.yml@main
    with:
      network: true

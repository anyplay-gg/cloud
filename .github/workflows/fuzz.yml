name: fuzz

# Coverage-guided fuzzing of the token check, which reads what any client sends to the cloud and
# its relays: a minute per target on pull requests that touch it, a quarter of an hour every
# night. The corpus each run grows is kept in the cache for the next one; an input that breaks a
# target is kept as an artifact.

on:
  pull_request:
    paths:
      - "crates/ticket/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "900"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# The workspace names the network's API crate by relative path (`../network/crates/api`), so the
# job checks out both repositories side by side, as CI does.

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [ticket_forged, ticket_altered]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: cloud
      - id: network-pin
        name: Read the pinned network revision
        shell: bash
        run: echo "ref=$(tr -d '[:space:]' < cloud/network.ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: anyplay-gg/network
          ref: ${{ steps.network-pin.outputs.ref }}
          path: network
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: cloud/fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cloud/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        env:
          SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && '60' || inputs.seconds || '900' }}
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time="$SECONDS_PER_TARGET"
      - name: Shrink the corpus
        if: github.event_name != 'pull_request'
        run: cargo fuzz cmin ${{ matrix.target }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-${{ matrix.target }}
          path: cloud/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

# A complete AnyPlay cloud: the cloud, a relay and Caddy for TLS.
#
#   cp .env.example .env     # then edit it
#   docker compose up -d
#
# Build context: the folder that holds the `cloud/` and `network/` checkouts (see Dockerfile).

name: anyplay

x-build: &build
  context: ../..
  dockerfile: cloud/deploy/Dockerfile

# Docker keeps every container log forever by default; this caps each at 3 x 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  cloud:
    # Every service has an image name of its own, so that update.sh --image can put a pulled image
    # under it (a plain `docker compose build` gives the same names: project `anyplay` + service).
    image: anyplay-cloud
    build:
      <<: *build
      target: cloud
    restart: unless-stopped
    logging: *logging
    environment:
      ANYPLAY_CLOUD_NAME: ${CLOUD_NAME:-AnyPlay cloud}
      # The relay listens for HTTPS on 8443 because Caddy holds port 443; see docs/configuration.md.
      ANYPLAY_CLOUD_RELAYS: https://${RELAY_DOMAIN:?set RELAY_DOMAIN in .env}:8443
      ANYPLAY_CLOUD_TRUST_PROXY: "true"
      ANYPLAY_CLOUD_MAIL: ${MAIL:-smtp}
      ANYPLAY_CLOUD_MAIL_FROM: ${MAIL_FROM:-}
      ANYPLAY_CLOUD_ALLOW_LOG_MAIL: ${ALLOW_LOG_MAIL:-}
      ANYPLAY_CLOUD_SMTP_HOST: ${SMTP_HOST:-}
      ANYPLAY_CLOUD_SMTP_PORT: ${SMTP_PORT:-}
      ANYPLAY_CLOUD_SMTP_TLS: ${SMTP_TLS:-}
      ANYPLAY_CLOUD_SMTP_USERNAME: ${SMTP_USERNAME:-}
      ANYPLAY_CLOUD_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ANYPLAY_CLOUD_SIGNUP: ${SIGNUP:-open}
      ANYPLAY_CLOUD_PRIVACY_URL: ${PRIVACY_URL:-}
      ANYPLAY_CLOUD_TERMS_URL: ${TERMS_URL:-}
      ANYPLAY_CLOUD_TERMS_VERSION: ${TERMS_VERSION:-}
      # The account web and passkeys live on this address.
      ANYPLAY_CLOUD_PUBLIC_URL: https://${CLOUD_DOMAIN:?set CLOUD_DOMAIN in .env}
      ANYPLAY_CLOUD_ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # Retiring old launchers (docs/configuration.md): off while empty.
      ANYPLAY_CLOUD_MIN_LAUNCHER_VERSION: ${MIN_LAUNCHER_VERSION:-}
      # Linked accounts (docs/configuration.md): a service stays off while its setting is empty.
      ANYPLAY_CLOUD_DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      ANYPLAY_CLOUD_DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      ANYPLAY_CLOUD_STEAM_API_KEY: ${STEAM_API_KEY:-}
      # Web Push (docs/configuration.md, "Notifications"): off while these are empty.
      ANYPLAY_CLOUD_VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      ANYPLAY_CLOUD_VAPID_SUBJECT: ${VAPID_SUBJECT:-}
    volumes:
      - cloud-data:/data

  relay:
    image: anyplay-relay
    build:
      <<: *build
      target: relay
    restart: unless-stopped
    logging: *logging
    # The relay answers on its plain HTTP port when it is up (the image has bash, no curl).
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3340"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      cloud:
        condition: service_healthy
    environment:
      # The cloud writes its public key here on its first start; the relay waits for it.
      ANYPLAY_RELAY_CLOUD_PUBLIC_KEY_FILE: /cloud/signing.pub
      ANYPLAY_RELAY_TLS: reloading
      # Caddy keeps the certificate of ${RELAY_DOMAIN} here; the relay waits for it to appear.
      ANYPLAY_RELAY_CERT_FILE: /caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${RELAY_DOMAIN}/${RELAY_DOMAIN}.crt
      ANYPLAY_RELAY_KEY_FILE: /caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${RELAY_DOMAIN}/${RELAY_DOMAIN}.key
      ANYPLAY_RELAY_HTTP_BIND: 0.0.0.0:3340
      ANYPLAY_RELAY_HTTPS_BIND: 0.0.0.0:8443
      ANYPLAY_RELAY_QUIC_BIND: 0.0.0.0:7842
      # Prometheus metrics; this port is not published below.
      ANYPLAY_RELAY_METRICS_BIND: 0.0.0.0:9091
    # Room for the default max_clients (docs/configuration.md, "Running a relay").
    ulimits:
      nofile:
        soft: 30000
        hard: 30000
    ports:
      - "8443:8443"
      - "7842:7842/udp"
    volumes:
      - cloud-data:/cloud:ro
      - caddy-data:/caddy:ro

  caddy:
    image: anyplay-caddy
    build:
      <<: *build
      target: caddy
    restart: unless-stopped
    logging: *logging
    # Caddy's admin endpoint listens on localhost inside the container.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      - cloud
    environment:
      CLOUD_DOMAIN: ${CLOUD_DOMAIN:?set CLOUD_DOMAIN in .env}
      RELAY_DOMAIN: ${RELAY_DOMAIN:?set RELAY_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    # Caddy runs as an unprivileged user and still binds the standard ports.
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  cloud-data:
  caddy-data:
  caddy-config:

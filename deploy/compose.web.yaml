# The website next to the cloud, on the same host name. Optional: add it with
#   COMPOSE_FILE=compose.yaml:compose.web.yaml   (in .env, so update.sh and every compose call see it)
# and the image, either prebuilt or built from a checkout of anyplaynet/web beside cloud/ and network/
# (or WEB_DIR pointing at one):
#   - WEB_IMAGE=ghcr.io/anyplaynet/web@sha256:...  runs that image (docker compose pull web, then up).
#     update.sh --web-image pulls and checks it, and tags it anyplay-web, the default name below.
#   - without WEB_IMAGE the image is built from the checkout and tagged anyplay-web.
services:
  web:
    image: ${WEB_IMAGE:-anyplay-web}
    build:
      context: ${WEB_DIR:-../../web}
    restart: unless-stopped
    # The instance's own details (operator, address, contact), from deploy/.env. See docs/deploy.md.
    environment:
      SITE_URL: ${SITE_URL:-}
      LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:-}
      LEGAL_OPERATOR_STREET: ${LEGAL_OPERATOR_STREET:-}
      LEGAL_OPERATOR_CITY: ${LEGAL_OPERATOR_CITY:-}
      LEGAL_OPERATOR_COUNTRY: ${LEGAL_OPERATOR_COUNTRY:-}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-}
      LEGAL_PRIVACY_EMAIL: ${LEGAL_PRIVACY_EMAIL:-}
      LEGAL_ABUSE_EMAIL: ${LEGAL_ABUSE_EMAIL:-}
      LEGAL_AUTHORITY_NAME: ${LEGAL_AUTHORITY_NAME:-}
      LEGAL_AUTHORITY_STREET: ${LEGAL_AUTHORITY_STREET:-}
      LEGAL_AUTHORITY_CITY: ${LEGAL_AUTHORITY_CITY:-}
      LEGAL_AUTHORITY_SITE: ${LEGAL_AUTHORITY_SITE:-}
      COMMUNITY_DISCORD_URL: ${COMMUNITY_DISCORD_URL:-}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    read_only: true
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  # The website serves /sign-in, /create and /account, so the cloud sends the launcher's sign-in
  # there (portal_external) instead of to its own older pages.
  cloud:
    environment:
      ANYPLAY_CLOUD_PORTAL_EXTERNAL: "true"
      # GET /v1/status asks the website here whether it answers.
      ANYPLAY_CLOUD_STATUS_WEB_URL: http://web:3000/

  caddy:
    depends_on:
      - web
    volumes:
      - ./web.caddy:/etc/caddy/site.d/web.caddy:ro

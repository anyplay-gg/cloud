{{- if .Values.networkPolicy.enabled }}
# Everything is denied except what the cloud needs. The rules below add to each other.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "anyplay-cloud.fullname" . }}-default-deny
  labels:
    {{- include "anyplay-cloud.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "anyplay-cloud.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "anyplay-cloud.fullname" . }}-allow-api
  labels:
    {{- include "anyplay-cloud.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "anyplay-cloud.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with .Values.networkPolicy.apiFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.networkPolicy.metricsFrom }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "anyplay-cloud.fullname" . }}-allow-metrics
  labels:
    {{- include "anyplay-cloud.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "anyplay-cloud.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: metrics
          protocol: TCP
      from:
        {{- toYaml .Values.networkPolicy.metricsFrom | nindent 8 }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "anyplay-cloud.fullname" . }}-allow-egress
  labels:
    {{- include "anyplay-cloud.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "anyplay-cloud.selectorLabels" . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    # DNS
    - to:
        {{- toYaml .Values.networkPolicy.dns.to | nindent 8 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL
    - to:
        {{- toYaml .Values.networkPolicy.postgres.to | nindent 8 }}
      ports:
        - port: {{ .Values.networkPolicy.postgres.port }}
          protocol: TCP
    # NATS
    - to:
        {{- toYaml .Values.networkPolicy.nats.to | nindent 8 }}
      ports:
        - port: {{ .Values.networkPolicy.nats.port }}
          protocol: TCP
    {{- if eq .Values.config.mail "smtp" }}
    # SMTP
    - to:
        {{- toYaml .Values.networkPolicy.smtp.to | nindent 8 }}
      ports:
        - port: {{ include "anyplay-cloud.smtpPort" . }}
          protocol: TCP
    {{- end }}
{{- end }}
